    hi-en: ['(baaye|baayen|bayen|left) haath (tak|mein)', 'haath tak ja']
    hi: ['बाएं हाथ (तक|में)', 'बाएँ हाथ (तक|में)', 'हाथ तक जा', 'जबड़े तक']
