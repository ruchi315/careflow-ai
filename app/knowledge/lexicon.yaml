# Multilingual clinical lexicon used for extraction and glossing.
# Every pattern is a regular expression matched against normalised text
# (Latin text is lower-cased; Indic digits are mapped to ASCII; ZWJ/ZWNJ removed).
# Keys: en = English, hi-en = Hinglish (romanised), hi = Hindi, ta = Tamil, bn = Bengali.
# Indic patterns are matched with a left word-boundary only, so inflected forms still match.
# NOTE: Tamil/Bengali entries were authored for the hackathon and need native-speaker review.

