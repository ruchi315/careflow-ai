    hi-en: ['(seene|seena|sine|chhati|chaati) (mein|me|main|men)? ?.{0,14}dard', 'seena dard']
    hi: ['सीने में .{0,12}दर्द', 'सीने में दर्द', 'छाती में .{0,12}दर्द', 'सीने का दर्द']
    ta: ['நெஞ்சு வலி', 'நெஞ்சுவலி', 'மார்பு வலி']
    bn: ['বুকে ব্যথা', 'বুকে ব্যাথা', 'বুক ব্যথা', 'বুকে ব্যথা']
